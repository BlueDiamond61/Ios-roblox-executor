name: MobileBloxStudio
options:
  bundleIdPrefix: com.bluediamond
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  MobileBloxStudio:
    type: application
    platform: iOS
    sources:
      - path: MobileBloxStudio
    dependencies:
      - target: MobileBloxStudioKit
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bluediamond.mobilebloxstudio
        PRODUCT_NAME: MobileBloxStudio
        INFOPLIST_FILE: MobileBloxStudio/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        SWIFT_EMIT_LOC_STRINGS: YES
  MobileBloxStudioKit:
    type: framework
    platform: iOS
    sources:
      - path: MobileBloxStudioKit/Sources/MobileBloxStudioKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bluediamond.mobilebloxstudio.kit
        PRODUCT_NAME: MobileBloxStudioKit
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
